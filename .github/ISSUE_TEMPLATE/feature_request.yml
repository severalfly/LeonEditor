name: 功能建议
description: 提出一个新功能或改进想法
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢建议！请重点说明**使用场景**，而不只是描述想要的按钮——
        了解真实场景才能设计得更合适。

  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 你在什么情况下需要这个功能？现在是怎么绕过去的？
      placeholder: |
        我经常需要处理 xxx，现在只能先复制到 xxx 再手动改，很麻烦。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 希望的做法
      description: 你设想的交互是什么样的？
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的其他方案
    validations:
      required: false

  - type: dropdown
    id: scope
    attributes:
      label: 这个功能更接近
      options:
        - 编辑器核心能力（编辑、选择、折叠等）
        - 查找与搜索
        - 文件与文件夹管理
        - 编码与换行处理
        - 界面与主题
        - 快捷键与效率工具
        - 其他
    validations:
      required: true
