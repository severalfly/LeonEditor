name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ---------- 前端 + Rust 编译检查 ----------
  check:
    name: Check (frontend + Rust)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install npm deps
        run: npm ci

      - name: Build frontend
        run: npm run build:fast

      - name: Cargo check
        working-directory: src-tauri
        run: cargo check

  # ---------- 手动触发时才构建并发布 portable 包 ----------
  # 说明：不用 tag 自动发布，是因为 CI 的 Windows runner 产物是 MSVC 构建，
  # 与维护者本地验证过的 mingw 构建不是同一份二进制；自动覆盖会让
  # 「发布的包」和「测过的包」对不上。需要发版时在 Actions 页面手动 Run。
  release:
    name: Release portable build
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install npm deps
        run: npm ci

      - name: Build
        run: npx tauri build --no-bundle

      - name: Assemble portable folder
        run: node scripts/make-portable.mjs

      - name: Package as zip
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart('v')
          $name = "LeonEditor-$ver-portable"
          Compress-Archive -Path "dist-portable\*" -DestinationPath "$name.zip"
          "ASSET_NAME=$name.zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Get-Item "$name.zip" | Select-Object Name, Length

      - name: Resolve release notes
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $path = ".github/release-notes/$tag.md"
          if (Test-Path $path) {
            "BODY_PATH=$path" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            Write-Host "using curated notes: $path"
          } else {
            Write-Host "no curated notes for $tag, will auto-generate"
          }

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET_NAME }}
          body_path: ${{ env.BODY_PATH }}
          generate_release_notes: ${{ env.BODY_PATH == '' }}
          draft: false
          prerelease: false
