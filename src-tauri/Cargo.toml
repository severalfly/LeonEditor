[package]
name = "leon-editor"
version = "0.1.0"
description = "Leon Editor - fast portable text and code editor"
authors = ["severalfly"]
license = "Apache-2.0"
repository = "https://github.com/severalfly/LeonEditor"
edition = "2021"
rust-version = "1.77"

[lib]
name = "leon_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

encoding_rs = "0.8"
rayon = "1.10"
memchr = "2.7"
regex = "1.11"
walkdir = "2.5"
ignore = "0.4"
dirs = "5"
dunce = "1"
grep-searcher = "0.1"
grep-regex = "0.1"
grep-matcher = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
